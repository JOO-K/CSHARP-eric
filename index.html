<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spindeck — Mockup</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png?v=1">
  <link rel="icon" type="image/png" sizes="512x512" href="images/spindeck-appicon.png?v=1">
  <link rel="apple-touch-icon" sizes="180x180" href="images/spindeck-appicon-180.png?v=1">
  <meta name="theme-color" content="#111116">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,800;1,9..40,400&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=SUSE+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=152">
  <link rel="stylesheet" href="app.css?v=360">
  <link rel="stylesheet" href="roadmap.css?v=6">
</head>
<body>

  <!-- ==================== DESKTOP VIEWER ==================== -->
  <div id="viewer">

    <header id="toolbar">
      <div class="tb-section">
        <img class="vinyl-icon" src="images/spindeck-icon-white.png" alt="">
        <span class="tb-name" role="img" aria-label="Spindeck"></span>
        <span class="tb-tag">mockup</span>
        <!-- Persona switcher — filled by renderPersonaBar() in app.js from window.PERSONAS -->
        <div class="tb-persona" id="persona-bar" aria-label="Persona"></div>
      </div>

      <div class="tb-section center">
        <button class="tb-nav" id="btn-prev" title="Previous  ← ">&#8249;</button>
        <div class="tb-screen-info">
          <span id="lbl-name">Home</span>
          <span class="tb-idx" id="lbl-idx">3 / 13</span>
        </div>
        <button class="tb-nav" id="btn-next" title="Next  → ">&#8250;</button>
      </div>

      <div class="tb-section end">
        <div class="tb-zoom">
          <button class="tb-act tb-zoom-btn" id="btn-zoom-out" title="Zoom out">−</button>
          <span id="lbl-zoom" class="tb-zoom-lbl">100%</span>
          <button class="tb-act tb-zoom-btn" id="btn-zoom-in" title="Zoom in">+</button>
        </div>
        <!-- Plan switcher — view the whole mockup as a Free or Pro account.
             Filled by renderPlanBar() in app.js. -->
        <div class="tb-plan" id="plan-bar" aria-label="Plan"></div>
        <button class="tb-act" id="btn-devbox" onclick="toggleDevBox()" title="Tune the compact bento info box">⚙ Dev</button>
        <button class="tb-act" id="btn-petbox" onclick="togglePetBox()" title="The nav pet — every reaction and what fires it">☺ Pet</button>
        <button class="tb-act" id="btn-roadmap" onclick="toggleRoadmap()" title="Project roadmap — editable, autosaves">🗺 Roadmap</button>
        <button class="tb-act" id="btn-shuffle" title="Shuffle featured album">⟳ Shuffle</button>
        <button class="tb-act" id="btn-export" title="Export current screen as PNG">⬇ PNG</button>
        <a class="tb-act" href="dot-lab.html" target="_blank" title="Design dot-matrix assets">◌ Dots</a>
        <a class="tb-act" href="flowchart.html" target="_blank">Page Map ↗</a>
      </div>
    </header>

    <main id="stage">
      <nav id="page-nav"></nav>
      <div id="phone-container"></div>
      <!-- Dev box: live-tunes the compact bento's two info lines and prints the
           CSS. Built by initDevBox() in app.js; desktop viewer only. -->
      <aside id="devbox" hidden>
        <div class="db-hd">
          <span class="db-title">Tune</span>
          <button class="db-x" onclick="toggleDevBox()" title="Close">×</button>
        </div>
        <!-- Tab strip — filled by devBoxRenderTabs() from DEVBOX_TABS -->
        <div class="db-tabs" id="db-tabs"></div>
        <div class="db-body" id="db-body"></div>
        <div class="db-foot">
          <button class="db-btn" onclick="devBoxReset()">Reset</button>
          <button class="db-btn db-btn--go" onclick="devBoxCopy(this)">Copy CSS</button>
        </div>
        <textarea class="db-out" id="db-out" readonly spellcheck="false"></textarea>
      </aside>

      <!-- Pet box: every reaction the nav pet can play, looping live, with what
           fires each one. Click a cell to play it on the phone. Built by
           initPetBox() in app.js; desktop viewer only. -->
      <aside id="petbox" hidden>
        <div class="db-hd">
          <span class="db-title">Nav pet</span>
          <button class="db-x" onclick="togglePetBox()" title="Close">×</button>
        </div>
        <div class="db-body" id="pet-body"></div>
        <div class="db-foot">
          <span class="pet-hint">click a cell to play it on the phone</span>
        </div>
      </aside>

      <!-- Roadmap: editable planning board behind the toolbar's Roadmap button.
           Inside #stage (already position:relative) so it covers the phones but
           leaves the toolbar reachable. Built by rmInit() in roadmap.js on first
           open; desktop viewer only. -->
      <section id="roadmap" hidden>
        <header class="rm-hd">
          <span class="rm-hd-title">Spindeck — Roadmap</span>
          <!-- Range + week count are filled by rmInit() from RM_START /
               RM_WEEK_COUNT, so extending the board can't leave a stale date
               sitting in the header. -->
          <span class="rm-hd-sub" id="rm-hd-sub">click a line to edit, a day to add an event</span>
          <span class="rm-hd-spacer"></span>
          <button class="rm-btn" onclick="rmReset()">Reset</button>
          <button class="rm-btn" onclick="rmCopyLink(this)"
                  title="Copy a link that carries this whole board — the only way to hand it to someone else">Copy link</button>
          <button class="rm-btn" onclick="rmDownload(this)">Download .md</button>
          <!-- The other half of Download: a board saved out as markdown reads
               back in through rmParseMarkdown. The input is hidden and reused;
               rmUpload clears it each time so re-picking the same file still
               fires a change event. -->
          <button class="rm-btn" onclick="rmUpload(this)"
                  title="Load a roadmap .md saved with Download — replaces this browser's board">Upload .md</button>
          <input id="rm-file" type="file" accept=".md,.markdown,text/markdown,text/plain" hidden>
          <button class="rm-btn rm-btn--go" onclick="rmCopy(this)">Copy Markdown</button>
          <button class="rm-btn rm-btn--x" onclick="toggleRoadmap()" title="Close (Esc)">×</button>
        </header>

        <div class="rm-grid">
          <!-- LEFT: calendar over the linear timeline. RIGHT: goals + notes,
               the whole column, since those are what gets written in live. -->
          <div class="rm-col">
            <!-- TWO months on screen, stepping by one, so a page turn keeps
                 the month you were reading beside the one you're moving to.
                 Every row is exactly one roadmap week (weeks run Fri → Thu
                 from Aug 21), so hovering a day lights the matching row in
                 the timeline below and prints what's due into .rm-cal-read.
                 Clicking a DAY opens its event popover; clicking the W-number
                 jumps to that week. Slides: rmCalHTML() into .rm-cal-track. -->
            <div class="rm-card rm-card--cal">
              <div class="rm-card-hd">
                <span class="rm-card-title">Calendar</span>
                <button class="rm-cal-nav" id="rm-cal-prev" onclick="rmCalStep(-1)"
                        title="Back one month">&#8249;</button>
                <span class="rm-cal-name" id="rm-cal-name">—</span>
                <button class="rm-cal-nav" id="rm-cal-next" onclick="rmCalStep(1)"
                        title="Forward one month">&#8250;</button>
                <span class="rm-cal-pips" id="rm-cal-pips"></span>
              </div>
              <div class="rm-card-body rm-cal-body">
                <div class="rm-cal-view" id="rm-cal">
                  <div class="rm-cal-track" id="rm-cal-track"></div>
                </div>
                <!-- The hover answer. Its own line, so a long week item has
                     the full width instead of a sliver of the header. -->
                <div class="rm-cal-read" id="rm-cal-read"></div>
              </div>
            </div>

            <div class="rm-card">
              <div class="rm-card-hd">
                <span class="rm-card-title">Timeline</span>
                <span class="rm-card-sub">chips cycle: status · track</span>
              </div>
              <div class="rm-card-body" id="rm-timeline"></div>
            </div>
          </div>

          <div class="rm-col">
            <div class="rm-card rm-card--goals">
              <div class="rm-card-hd">
                <span class="rm-card-title">Goals</span>
                <span class="rm-card-sub">short · medium · long term</span>
              </div>
              <div class="rm-card-body" id="rm-goals"></div>
            </div>
            <div class="rm-card rm-card--notes">
              <div class="rm-card-hd">
                <span class="rm-card-title">Meeting notes</span>
                <span class="rm-card-sub">one tab per session · autosaves in this browser</span>
              </div>
              <!-- One tab per meeting, filled by rmTabsRender(). The textarea
                   below is a single element rebound on every switch, not one
                   per tab — see the note-sessions block in roadmap.js. -->
              <div class="rm-tabs" id="rm-tabs"></div>
              <div class="rm-card-body">
                <textarea class="rm-notes" id="rm-notes" spellcheck="false"
                          placeholder="Notes, decisions, questions…"></textarea>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <nav id="thumb-tray" aria-label="Screen thumbnails"></nav>

  </div>

  <!-- ==================== MOBILE APP ==================== -->
  <div id="mobile-app">

    <header id="mobile-bar">
      <div class="mb-seg" id="mb-seg">                                
        <button class="mb-btn" data-mview="single">Single</button>
        <button class="mb-btn" data-mview="multi">Multi</button>
        <button class="mb-btn" data-mview="flow">Flow</button>
        <button class="mb-btn" data-mview="live">Live</button>
      </div>
      <!-- Same persona switcher as the desktop toolbar (renderPersonaBar fills both) -->
      <div class="tb-persona tb-persona--mb" id="persona-bar-mb" aria-label="Persona"></div>
      <button id="mb-fs" title="Fullscreen"></button>
    </header>

    <div id="mb-stage">

      <div id="mb-single" class="mb-view">
        <div class="mb-subnav">
          <button class="mb-nav-btn" id="mb-prev">&#8249;</button>
          <span id="mb-screen-name"></span>
          <button class="mb-nav-btn" id="mb-next">&#8250;</button>
        </div>
        <div id="mb-phone-center"></div>
      </div>

      <div id="mb-multi" class="mb-view">
        <div id="mb-multi-grid"></div>
      </div>

      <div id="mb-flow" class="mb-view">
        <iframe src="flowchart.html" id="mb-flow-frame" frameborder="0"></iframe>
      </div>

      <div id="mb-live" class="mb-view">
        <div id="mobile-wrap">
          <div id="mobile-content"></div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <!-- SD_DOTS — the brand dot-matrix generator. Must load before screens.js:
       the home screen's static markup calls sdPet() as it parses. Design new
       patterns in dot-lab.html (toolbar → ◌ Dots). -->
  <script src="dots.js?v=1"></script>
  <script src="data.js?v=143"></script>
  <!-- GENERATED by tools/build_personas.py from personas/*.csv — must load after
       data.js (it swaps ARCHIVE) and before app.js (which applies the persona). -->
  <script src="personas.js?v=8"></script>
  <script src="screens.js?v=268"></script>
  <script src="app.js?v=310"></script>
  <!-- Quick share — needs app.js first (computeAlbumColors, albumDraft, shellAlbum). -->
  <script src="share.js?v=8"></script>
  <!-- Roadmap overlay. Independent of the prototype — loads last, touches
       nothing in app.js, and only runs when the toolbar button is pressed. -->
  <script src="roadmap.js?v=8"></script>
</body>
</html>
